name: integration

# Hits the live USAspending API and verifies upstream documentation links, so
# this runs on a weekly schedule and on demand rather than gating every push.
# The golden-master suite inside it is the only check against live data shapes.
# Note GitHub disables scheduled workflows after 60 days without repository
# activity.

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Sync environment
        run: uv sync --locked
      - name: Run integration suite against the live API
        run: uv run --no-sync pytest -m integration -q
